name: CI
on: [push, pull_request]
jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [appointment_service, availability_service, notification_service]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sd/${{ matrix.svc }}:ci services/${{ matrix.svc }}
