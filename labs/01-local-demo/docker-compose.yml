services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  redis:
    image: redis:7
    ports: ["6379:6379"]

  appointment:
    build: ../../services/appointment_service
    environment:
      - DB_DSN=postgresql://postgres:postgres@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
    depends_on: [db, redis]

  availability:
    build: ../../services/availability_service
    environment:
      - DB_DSN=postgresql://postgres:postgres@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
    depends_on: [db, redis]

  notification:
    build: ../../services/notification_service

  gateway:
    image: nginx:1.27
    ports: ["8080:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [appointment, availability]
